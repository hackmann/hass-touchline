name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Optional: Create a GitHub release with artifacts or other tasks if needed
      # when a release is actually created.
      - name: Release Created
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Version: ${{ steps.release.outputs.tag_name }}"
          echo "Major: ${{ steps.release.outputs.major }}"
          echo "Minor: ${{ steps.release.outputs.minor }}"
          echo "Patch: ${{ steps.release.outputs.patch }}"
