name: workflow.yml
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v3"
      - uses: home-assistant/actions/hassfest@master
        continue-on-error: true
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: "brands"
