name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "42 1 28 * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: integration
          ignore: "brands license"
